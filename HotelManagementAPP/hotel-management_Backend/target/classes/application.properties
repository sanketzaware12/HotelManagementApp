spring.application.name=hotel-management
# ─── LuxeStay Hotel Management ───────────────────────────────────────────────

# Server
server.port=8080

# ─── Database (MySQL) ─────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/kolkata
spring.datasource.username=root
spring.datasource.password=Sanku@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── H2 In-Memory (for demo / testing — comment out MySQL block above) ────────
# spring.datasource.url=jdbc:h2:mem:luxestay
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.luxestay=DEBUG
logging.level.org.springframework.web=INFO

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null